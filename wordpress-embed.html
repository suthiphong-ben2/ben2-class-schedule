<!-- วางในบล็อก "HTML ที่กำหนดเอง" ของหน้า WordPress (แก้ลิงก์ src ให้เป็นที่อยู่ GitHub Pages จริง) -->
<iframe id="ben2tt-frame" src="https://suthiphong-ben2.github.io/ben2-class-schedule/" title="ตารางเรียน ตารางสอน ตารางสอบ"
  style="width:100%;height:900px;border:0;display:block" loading="lazy"></iframe>
<script>
  // ปรับความสูงของกรอบตามเนื้อหา และส่งลิงก์ #ห้อง ให้แชร์ต่อได้
  (function () {
    var f = document.getElementById('ben2tt-frame');
    if (location.hash) f.src = f.src.split('#')[0] + location.hash;
    window.addEventListener('message', function (e) {
      if (e.source === f.contentWindow && e.data && e.data.ben2tt) f.style.height = Math.max(600, e.data.height + 20) + 'px';
    });
  })();
</script>
