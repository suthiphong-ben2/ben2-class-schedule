  --mix:26%; --mix-strong:72%; color-scheme:dark}}

<body>
<header class="top"><div class="wrap">
  <img src="logo.png" alt="ตราโรงเรียนเบญจมราชรังสฤษฎิ์ ๒" class="logo" width="36" height="48">
  <div class="ttl"><h1 id="school">ระบบตารางเรียน/ตารางสอบนักเรียน <span class="nowrap">โรงเรียนเบญจมราชรังสฤษฎิ์ ๒</span></h1>
  <span class="term" id="term"></span></div>
  <a class="admin-link" href="admin.html" target="_blank" rel="noopener">ผู้ดูแล</a>
</div></header>
<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="มุมมอง">
    <button role="tab" data-v="c" id="tab-c">ตารางเรียนรายห้อง</button>
    <button role="tab" data-v="t" id="tab-t">ตารางครู</button>
    <button role="tab" data-v="r" id="tab-r">การใช้ห้อง</button>
    <button role="tab" data-v="f" id="tab-f">หาครูว่าง / ห้องว่าง</button>
    <button role="tab" data-v="e" id="tab-e">ตารางสอบ</button>
  </nav>
  <div class="layout">
    <aside class="panel" id="panel"></aside>
    <main id="main"></main>
  </div>
</div>
<footer class="credit"><div class="wrap">พัฒนาระบบโดย <b>ครูสุทธิพงษ์ สุขสร้อย</b> · โรงเรียนเบญจมราชรังสฤษฎิ์ ๒</div></footer>
<script>
const API = window.BEN2TT_API;
const mainEl = document.getElementById('main');
mainEl.innerHTML = '<div class="loading">กำลังโหลดตาราง…</div>';
async function loadData(){
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem('ben2tt-cache') || 'null'); } catch(_) {}
  try {
    if (cache) {
      const v = await (await fetch(API + '?action=version')).json();
      if (v.ok && v.version === cache.version) return cache;
    }
    const d = await (await fetch(API + '?action=data')).json();
    if (!d.ok) throw new Error(d.error || 'โหลดข้อมูลไม่สำเร็จ');
    try { localStorage.setItem('ben2tt-cache', JSON.stringify(d)); } catch(_) {}
    return d;
  } catch (err) {
    if (cache) return cache;
    throw err;
  }
}
// ส่งความสูงให้หน้าเว็บโรงเรียนที่ฝังด้วย iframe
if (window.parent !== window && window.ResizeObserver) {
  new ResizeObserver(() => parent.postMessage({ben2tt: true, height: document.documentElement.scrollHeight}, '*')).observe(document.body);
}
// ข้อมูลเติมช่องว่างจากตาราง PDF ของฝ่ายวิชาการ (ไม่บังคับ ถ้าโหลดไม่ได้ก็แสดงตาม T_ONE อย่างเดียว)
const loadPdf = fetch('pdf-fill.json').then(r => r.ok ? r.json() : null).catch(() => null);
Promise.all([loadData(), loadPdf]).then(([d, pdf]) => { d.pdf = pdf; start(d); }).catch(err => {
  mainEl.innerHTML = `<div class="errbox"><b>โหลดตารางไม่สำเร็จ</b><br>ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองรีเฟรชหน้าอีกครั้ง<br><small>${String(err.message||err).replace(/</g,'&lt;')}</small></div>`;
});

function start(DATA){
if (!DATA.teachers || !DATA.teachers.length) {
  mainEl.innerHTML = '<div class="errbox"><b>ยังไม่มีข้อมูลตารางสอน</b><br>ฝ่ายวิชาการยังไม่ได้อัปโหลดไฟล์ตารางสอนของภาคเรียนนี้</div>';
  return;
}
const SUBJ = Object.assign({}, (DATA.pdf && DATA.pdf.subjects) || {}, DATA.subjects || {});
const PT = Array.from({length:10}, (_,i) => { const x=(DATA.periods||[]).find(q=>q.p===i+1); return x && x.start ? x.start + (x.end ? '–' + x.end : '') : ''; });
const DAYS = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'];
const DAYS_S = ['จ.','อ.','พ.','พฤ.','ศ.'];
const NP = 9;   // โรงเรียนเรียนถึงคาบ 9 ไม่มีคาบ 10
const CAT = {'ท':['th','ภาษาไทย'],'ค':['ma','คณิตศาสตร์'],'ว':['sc','วิทยาศาสตร์และเทคโนโลยี'],'ส':['so','สังคมศึกษา'],'พ':['pe','สุขศึกษาและพลศึกษา'],'ศ':['ar','ศิลปะ'],'ง':['oc','การงานอาชีพ'],'อ':['en','ภาษาอังกฤษ'],'จ':['fl','ภาษาจีน/ญี่ปุ่น'],'ญ':['fl','ภาษาจีน/ญี่ปุ่น'],'I':['is','IS'],'ก':['ac','กิจกรรม/แนะแนว'],'เ':['ex','เสริม/CEFR'],'C':['ex','เสริม/CEFR']};
const hueOf = s => 'var(--h-' + ((CAT[s[0]]||['is'])[0]) + ')';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isRoom = r => r && !/^\d$/.test(r);
const levelOf = c => { const m = /^(\d)/.exec(c); return m ? +m[1] : 0; };
function expandClass(c){
  const m = /^(\d)\/(\d+)-(\d+)$/.exec(c);
  if (!m) return [c];
  const out=[]; for (let i=+m[2]; i<=+m[3]; i++) out.push(m[1]+'/'+i); return out;
}
function classSlug(c){ return c.replace('/', '-').replace('วิทย์','sci').replace('ศิลป์','art').replace('เสรี','free'); }

// ---- indices
const T = DATA.teachers;
const tById = new Map(T.map(t => [t.id, t]));
const byClass = new Map(), byRoom = new Map(), busy = new Map();
const grid = () => Array.from({length:5}, () => Array.from({length:NP}, () => []));
const actCount = new Map();
T.forEach(t => { t.x = t.x.filter(e => e.p < NP); });   // ตัดข้อมูลคาบ 10 ที่หลุดมาในไฟล์ T_ONE
for (const t of T) {
  const b = grid(); busy.set(t.id, b);
  for (const e of t.x) {
    b[e.d][e.p].push(e);
    if (e.a) { const k=e.a+'|'+e.d+'|'+e.p; actCount.set(k,(actCount.get(k)||0)+1); continue; }
    if (e.c) for (const c of expandClass(e.c)) {
      if (!byClass.has(c)) byClass.set(c, grid());
      byClass.get(c)[e.d][e.p].push({...e, t:t.id});
    }
    if (isRoom(e.r)) {

function mergeSame(list){

// ---- ส่งออกตารางเป็นภาพ / PDF ขนาด A4 (วาดลง canvas เอง ไม่พึ่งการจับภาพหน้าจอ)
const HEX = {th:'#C2410C',ma:'#2563EB',sc:'#059669',so:'#A16207',pe:'#DC2626',ar:'#DB2777',oc:'#7C3AED',en:'#0891B2',fl:'#65A30D',is:'#475569',ac:'#78716C',ex:'#4F46E5'};

function mixHex(hex, t, base){ const a=parseInt(hex.slice(1),16), b=parseInt((base||'#FFFFFF').slice(1),16);

const shortName = n => n.replace(/^(นางสาว|นาย|นาง|Mr\.|Ms\.|Mrs\.)\s*/,'');
function exportBar(){

function mergeX(list, fmt){

const clsTxt = c => (/^\d/.test(c)?'ม.':'')+c;
function sheetSpec(){

      cell:(d,p)=>{ if (!b[d][p].length){ const x=pdfT(t.id,d,p); return x ? [x.a ? {act:x.a} : {s:x.s, det:[x.c&&clsTxt(x.c), x.r&&isRoom(x.r)?roomLabel(x.r):''].filter(Boolean).join(' · ')}] : []; }

    return {lunch: lunchFor(c), kicker:'ตารางเรียน', title: grp ? c : 'ม.'+c, sub: grp ? 'กลุ่มเรียน (รวมหลายห้อง)' : 'ตารางเรียนนักเรียน', term, file:`ตารางเรียน-${grp?c:'ม.'+c.replace('/','-')}`,
      cell:(d,p)=>{ const l=g[d][p]; if(!l.length){ const x=!grp&&pdfC(c,d,p);
          if (x && x.a) { const label=x.a.replace(/^เลือก\s*/,'วิชาเลือก ').replace('พัฒนา ศักยภาพ','พัฒนาศักยภาพ');
            return [{act:label}]; }
          if (x) return [{s:x.s, det:[tById.has(x.t)?shortT(x.t):'', x.r&&isRoom(x.r)?roomLabel(x.r):''].filter(Boolean).join(' · ')}];
          const w=!grp&&wideFor(c,d,p); return w?[{act:w.a}]:[]; }
        if (grp && mergeSame(l).length > 2) return [{list:'', rows:mergeSame(l).map(e=>({s:e.s, t:[/^เสรี/.test(c)&&e.rs.length?'ม.'+e.rs.join(','):'', (e.ts||[]).map(shortT).join(', ')].filter(Boolean).join(' · ')}))}];
        return mergeX(l, e=>[e.ts.map(shortT).join(', '), e.rs.filter(isRoom).map(roomLabel).join(', ')].filter(Boolean).join(' · ')); }}; }
  const r=S.r, g=byRoom.get(r);
  return {kicker:'ตารางการใช้ห้อง', title:roomLabel(r), sub:'การใช้ห้องตลอดสัปดาห์', term, file:`ตารางห้อง-${r}`,
    cell:(d,p)=>mergeX(g[d][p], e=>[e.cs.map(clsTxt).join(', '), e.ts.map(shortT).join(', ')].filter(Boolean).join(' · '))};

const SEG = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('th', {granularity:'word'}) : null;
function wrap(ctx, text, maxW){
  const parts = SEG ? [...SEG.segment(text)].map(x=>x.segment) : [...text];
  const lines=[]; let cur='';
  for (const w of parts){
    if (ctx.measureText(cur+w).width <= maxW) { cur += w; continue; }
    if (cur) lines.push(cur.trimEnd());
    cur = w.trimStart();
    while (ctx.measureText(cur).width > maxW && cur.length > 1){ let i=cur.length; while (i>1 && ctx.measureText(cur.slice(0,i)).width > maxW) i--; lines.push(cur.slice(0,i)); cur=cur.slice(i); }
  }
  if (cur) lines.push(cur);
  return lines;
}
function clip(ctx, text, maxW){ if (ctx.measureText(text).width<=maxW) return text; while (text.length>1 && ctx.measureText(text+'…').width>maxW) text=text.slice(0,-1); return text+'…'; }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const FB = '"IBM Plex Sans Thai","Noto Sans Thai",sans-serif', FD = '"Chakra Petch","IBM Plex Sans Thai",sans-serif';
async function drawSheet(){
  const spec = sheetSpec();
  await Promise.all([`400 11px ${FB}`,`600 11px ${FB}`,`700 26px ${FD}`,`600 12px ${FD}`].map(f=>document.fonts.load(f).catch(()=>{})));
  const logo = await new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src='logo.png'; });
  const W=1123, H=794, K=2, M=30;           // A4 แนวนอนที่ 96 dpi, วาดละเอียด 2 เท่า
  const cv=document.createElement('canvas'); cv.width=W*K; cv.height=H*K;

  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  // หัวกระดาษ
  let x0=M;
  if (logo){ const lh=60, lw=logo.width*lh/logo.height; ctx.drawImage(logo,M,22,lw,lh); x0=M+lw+14; }
  ctx.fillStyle=MUTED; ctx.font=`500 13px ${FB}`; ctx.fillText((DATA.meta.school||'')+' · '+spec.kicker, x0, 38);
  ctx.fillStyle='#16337F'; ctx.font=`700 26px ${FD}`; ctx.fillText(clip(ctx, spec.title, 640), x0, 68);
  ctx.fillStyle=MUTED; ctx.font=`400 12px ${FB}`; ctx.fillText(spec.sub, x0, 86);
  ctx.textAlign='right'; ctx.fillStyle=INK; ctx.font=`600 15px ${FD}`; ctx.fillText(spec.term, W-M, 40);
  ctx.fillStyle=MUTED; ctx.font=`400 11px ${FB}`;
  if (DATA.updatedAt) ctx.fillText('ข้อมูล ณ '+new Date(DATA.updatedAt).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}), W-M, 58);
  ctx.fillText('พิมพ์เมื่อ '+new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' · '+location.host+location.pathname.replace(/index\.html$/,''), W-M, 74);
  ctx.textAlign='left';
  ctx.fillStyle='#E2B33C'; ctx.fillRect(M, 94, W-2*M, 3);   // เส้นทองใต้หัวกระดาษ
  // ตาราง
  const top=104, bottom=H-46, dayW=74, headH=34, rowH=(bottom-top-headH)/5;
  // คอลัมน์ที่ว่างทั้งสัปดาห์ให้แคบลง ส่วนคอลัมน์ที่มีเรียนได้พื้นที่มากขึ้น
  const emptyCol = Array.from({length:NP}, (_,p) => [0,1,2,3,4].every(d => !spec.cell(d,p).length));
  const lunchCol = spec.lunch >= 0 && emptyCol[spec.lunch] ? spec.lunch : -1;
  const SL=40, nSl=emptyCol.filter(Boolean).length, wide=(W-2*M-dayW-SL*nSl)/(NP-nSl||1);
  const cw = p => emptyCol[p] ? SL : wide, cx0 = p => { let x=M+dayW; for (let i=0;i<p;i++) x+=cw(i); return x; };
  emptyCol.forEach((e,p)=>{ if (e){ ctx.fillStyle = p===lunchCol ? '#E3E9E6' : '#F6F8F7'; ctx.fillRect(cx0(p),top+headH,SL,bottom-top-headH); } });
  if (lunchCol>=0){ ctx.save(); ctx.translate(cx0(lunchCol)+SL/2+5, top+headH+(bottom-top-headH)/2); ctx.rotate(Math.PI/2); ctx.textAlign='center';
    ctx.fillStyle=MUTED; ctx.font=`600 14px ${FD}`; ctx.fillText('พักกลางวัน', 0, 0); ctx.restore(); }
  ctx.fillStyle=SUNK; ctx.fillRect(M,top,W-2*M,headH); ctx.fillRect(M,top,dayW,bottom-top);
  ctx.textAlign='center';
  for (let p=0;p<NP;p++){ const cx=cx0(p)+cw(p)/2, slim=emptyCol[p];

    if (PT[p] && !slim){ ctx.fillStyle=MUTED; ctx.font=`400 9.5px ${FB}`; ctx.fillText(PT[p], cx, top+28); } }
  ctx.textAlign='left';
  for (let d=0; d<5; d++){
    const y=top+headH+rowH*d;
    ctx.fillStyle=INK; ctx.font=`600 13px ${FD}`; ctx.fillText(DAYS[d], M+10, y+rowH/2+4);
    for (let p=0;p<NP;p++){
      const x=cx0(p), colW=cw(p), items=spec.cell(d,p); if (!items.length) continue;
      const shown=items.slice(0,3), more=items.length-shown.length, pad=3, gap=3;
      const eh=(rowH-2*pad-gap*(shown.length-1)-(more?12:0))/shown.length;
      shown.forEach((it,i)=>{
        const ex=x+pad, ey=y+pad+i*(eh+gap), ew=colW-2*pad;
        if (it.list !== undefined){   // รายการหลายวิชาในช่องเดียว: แสดงรหัส+ชื่อวิชา+ครู ทีละบรรทัด
          ctx.fillStyle='#F6F8F7'; rrect(ctx,ex,ey,ew,eh,4); ctx.fill(); ctx.strokeStyle=LINE; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
          ctx.save(); rrect(ctx,ex,ey,ew,eh,4); ctx.clip();
          let ty=ey+11; const tx=ex+4, tw=ew-8;
          if (it.list){ ctx.fillStyle=MUTED; ctx.font=`600 9.5px ${FB}`; ctx.fillText(clip(ctx,it.list,tw), tx, ty); ty+=11.5; }
          const avail = ey+eh-ty, n = it.rows.length, LH = 11;
          const withT = n*2*LH <= avail;                 // พื้นที่พอ: แสดงครูใต้ชื่อวิชา
          const cols = withT || n*8.6 <= avail ? 1 : 2;  // ไม่พอ: ย่อบรรทัด หรือแบ่ง 2 คอลัมน์
          const per = Math.ceil(n/cols), lh = Math.min(LH, avail/(per*(withT?2:1))), cwid = tw/cols - (cols>1?4:0);
          it.rows.forEach((r,i)=>{ const hex=hexOf(r.s), col=Math.floor(i/per), cx=tx+col*(tw/cols);
            let yy = ty + (i%per)*lh*(withT?2:1);
            ctx.fillStyle=mixHex(hex,.72,'#14211E'); ctx.font=`600 ${lh<10?8:9}px ${FD}`; ctx.fillText(r.s, cx, yy);
            const w0=ctx.measureText(r.s+' ').width; ctx.fillStyle=INK; ctx.font=`400 ${lh<10?8:9}px ${FB}`; ctx.fillText(clip(ctx,SUBJ[r.s]||'',cwid-w0), cx+w0, yy);
            if (withT && r.t){ ctx.fillStyle=MUTED; ctx.font=`400 8.5px ${FB}`; ctx.fillText(clip(ctx,r.t,cwid-6), cx+6, yy+lh); } });
          ctx.restore(); return; }
        if (it.act){ ctx.fillStyle=SUNK; rrect(ctx,ex,ey,ew,eh,4); ctx.fill(); ctx.fillStyle=MUTED; ctx.font=`500 10px ${FB}`; ctx.textAlign='center';
          const ls=wrap(ctx,it.act,ew-8).slice(0,3); ls.forEach((l,k)=>ctx.fillText(l, ex+ew/2, ey+eh/2-(ls.length-1)*6.5+k*13+3.5)); ctx.textAlign='left'; return; }
        const hex=hexOf(it.s); ctx.fillStyle=mixHex(hex,.16); rrect(ctx,ex,ey,ew,eh,4); ctx.fill();
        ctx.save(); rrect(ctx,ex,ey,ew,eh,4); ctx.clip();
        let ty=ey+13; const tx=ex+5, tw=ew-10;
        ctx.fillStyle=mixHex(hex,.72,'#14211E'); ctx.font=`600 11px ${FD}`; ctx.fillText(it.s, tx, ty);
        const nm=SUBJ[it.s]; ctx.font=`400 10px ${FB}`;
        const detLs = it.det ? wrap(ctx, it.det, tw) : [];
        const detN = Math.min(2, detLs.length), detH = detN*12.5;
        if (nm){ ctx.fillStyle=INK; const room=Math.max(0,Math.floor((ey+eh-ty-detH-4)/12.5)); const ls=wrap(ctx,nm,tw);
          ls.slice(0,room).forEach((l,k)=>{ const last=k===room-1 && ls.length>room; ty+=12.5; ctx.fillText(last?clip(ctx,l+'…',tw):l, tx, ty); }); }
        ctx.fillStyle=MUTED;
        for (let k=0; k<detN && ty+12.5 <= ey+eh-2; k++){ ty+=12.5; const last=k===detN-1 && detLs.length>detN; ctx.fillText(last?clip(ctx,detLs[k]+'…',tw):detLs[k], tx, ty); }
        ctx.restore();
      });
      if (more){ ctx.fillStyle=MUTED; ctx.font=`400 9.5px ${FB}`; ctx.fillText(`+${more} รายวิชา`, x+5, y+rowH-5); }
    }
  }
  ctx.strokeStyle=LINE; ctx.lineWidth=.8; ctx.strokeRect(M,top,W-2*M,bottom-top);
  ctx.beginPath(); ctx.moveTo(M,top+headH); ctx.lineTo(W-M,top+headH);
  for (let d=1; d<5; d++){ const y=top+headH+rowH*d; ctx.moveTo(M,y); ctx.lineTo(W-M,y); }
  for (let p=0;p<NP;p++){ const x=cx0(p); ctx.moveTo(x,top); ctx.lineTo(x,bottom); }

  let lx=M; ctx.font=`400 10px ${FB}`;
  const seen=new Map(); Object.values(CAT).forEach(([k,n])=>seen.set(k,n));
  for (const [k,n] of seen){ ctx.fillStyle=mixHex(HEX[k],.55); rrect(ctx,lx,H-30,9,9,2); ctx.fill(); ctx.fillStyle=MUTED; ctx.fillText(n, lx+13, H-22); lx+=ctx.measureText(n).width+26; }

}
function loadScript(src){ return new Promise((res,rej)=>{ if (document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('โหลดตัวสร้าง PDF ไม่สำเร็จ')); document.head.appendChild(s); }); }
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1500); }
async function doExport(kind, btn){
  const msg=document.getElementById('xmsg'); btn.disabled=true; msg.textContent='กำลังสร้างไฟล์…';
  try {
    const {cv, file} = await drawSheet();
    if (kind==='png') { await new Promise(r=>cv.toBlob(b=>{ saveBlob(b, file+'.png'); r(); }, 'image/png')); }
    else {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const pdf = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
      pdf.addImage(cv.toDataURL('image/jpeg', .93), 'JPEG', 0, 0, 297, 210);
      pdf.save(file+'.pdf');
    }
    msg.textContent='บันทึกแล้ว';
  } catch (e) { msg.textContent='สร้างไฟล์ไม่สำเร็จ: '+e.message; }
  finally { btn.disabled=false; setTimeout(()=>{ if (msg.textContent==='บันทึกแล้ว') msg.textContent=''; }, 3000); }
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v===S.v));
  const panel = document.getElementById('panel'), main = document.getElementById('main');
  const keepScroll = panel.querySelector('.list')?.scrollTop;
  if (S.v==='t'){ panel.innerHTML = panelTeachers(); main.innerHTML = viewTeacher(); }
  else if (S.v==='c'){ panel.innerHTML = panelClasses(); main.innerHTML = viewClass(); }
  else if (S.v==='r'){ panel.innerHTML = panelRooms(); main.innerHTML = viewRoom(); }
  else if (S.v==='e'){ panel.innerHTML = panelExam(); main.innerHTML = viewExam(); }
  else { panel.innerHTML = panelFree(); main.innerHTML = viewFree(); }
  main.querySelectorAll('[data-export]').forEach(b => b.addEventListener('click', () => doExport(b.dataset.export, b)));
  const cur = panel.querySelector('.pick[aria-current="true"]');
  const list = panel.querySelector('.list');
  if (list && keepScroll != null && S._lastV===S.v) list.scrollTop = keepScroll;
  else if (cur && list) list.scrollTop = Math.max(0, cur.offsetTop - list.offsetTop - 80);
  S._lastV = S.v;
  const q = panel.querySelector('#q');
  if (q) q.addEventListener('input', () => { S.q=q.value; const l=panel.querySelector('#list');
      const tmp=document.createElement('div'); tmp.innerHTML=panelTeachers(); l.innerHTML=tmp.querySelector('#list').innerHTML; });
  const dept = panel.querySelector('#dept,#fdept');
  if (dept) dept.addEventListener('change', () => { S.dept=dept.value; save(); render(); });
  panel.querySelectorAll('[data-el]').forEach(b => b.addEventListener('click', () => { S.el=b.dataset.el; render(); }));
  panel.querySelectorAll('[data-fd]').forEach(b => b.addEventListener('click', () => { S.fd=+b.dataset.fd; save(); render(); }));
  panel.querySelectorAll('[data-fp]').forEach(b => b.addEventListener('click', () => { S.fp=+b.dataset.fp; save(); render(); }));
}
document.getElementById('term').innerHTML = `ภาคเรียนที่ <b>${esc(DATA.meta.term)}</b> ปีการศึกษา <b>${esc(DATA.meta.year)}</b> · ครู ${T.length} คน · ${classes.filter(c=>/^\d\/\d+$/.test(c)).length} ห้องเรียน`;
fromHash();
if (!byClass.has(S.c)) S.c = classes[0];
if (!tById.has(S.t)) S.t = T[0].id;
if (!location.hash) history.replaceState(null,'','#'+hashFor());
if (DATA.updatedAt) document.getElementById('term').insertAdjacentHTML('beforeend', ` · <span class="updated">อัปเดต ${esc(new Date(DATA.updatedAt).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}))}</span>`);
render();
}
</script>
</body>
</html>
